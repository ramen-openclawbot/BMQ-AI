<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Demo · Đổi trả bánh · BMQ</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Urbanist:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:#e4e4e4;color:#231f20;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid #231f20;outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:Urbanist,"Be Vietnam Pro",sans-serif;font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* demo bar */
.demo{background:#231f20;color:#fff;padding:10px 12px;position:sticky;top:0;z-index:20}
.demo-in{max-width:1240px;margin:auto;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.demo b{font-size:13px;font-weight:700}
.demo small{display:block;color:#cfc8cb;font-size:11px}
.seg{display:flex;background:#3d383a;border-radius:999px;padding:3px;margin-left:auto}
.seg button{color:#e8e2e5;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;min-height:34px}
.seg button[aria-selected="true"]{background:#f4c1d9;color:#231f20}
.reset{color:#cfc8cb;font-size:12px;text-decoration:underline;text-underline-offset:3px;min-height:34px}
.steps{max-width:1240px;margin:12px auto 0;padding:0 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{background:#f7f7f5;border-radius:14px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center;min-height:56px}
.steps button i{font-style:normal;width:26px;height:26px;border-radius:50%;background:#e2e2df;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.steps button span{font-size:12.5px;font-weight:600;line-height:1.35}
.steps button.on{background:#fff;box-shadow:inset 0 0 0 2px #231f20}
.steps button.on i{background:#231f20;color:#fff}
.steps button.done i{background:#29bf12;color:#fff}

/* dealer, option C */
.dealer{max-width:560px;margin:14px auto 28px;padding:10px;background:#f4c1d9;border-radius:32px}
.phone{background:#fff;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;height:min(780px,calc(100dvh - 190px));min-height:600px}
.phone header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #dedbdd;flex:none}
.phone header h1{font-size:17px;font-weight:800;line-height:1.3}
.phone header p{font-size:12px;color:#625d60}
.logo{width:42px;height:42px;border-radius:50%;border:1px solid #dedbdd;object-fit:contain;padding:3px;flex:none}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;margin-left:-8px;flex:none}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0}
.foot{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #dedbdd;background:#fff}
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #dedbdd}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;color:#625d60;font-size:11px;min-height:58px;position:relative}
.nav button[aria-current="page"]{color:#231f20;font-weight:700}
.nav button[aria-current="page"] span{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.dot{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:#231f20;color:#fff;font-size:10px;display:grid;place-items:center;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:14px;font-weight:700;font-size:14.5px;background:#f4c1d9;padding:10px 14px}
.btn:hover:not(:disabled){box-shadow:inset 0 0 0 1px #625d60}
.btn:disabled{background:#efedee;color:#8d878a}
.btn.line{background:#fff;box-shadow:inset 0 0 0 1px #c9c4c7}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:14px 16px;border-bottom:1px solid #eceaeb;text-align:left}
.row .grow{flex:1;min-width:0}
.row strong{display:block;font-size:14.5px;font-weight:700}
.row em{display:block;font-style:normal;color:#625d60;font-size:12.5px}
.tile{width:46px;height:46px;border-radius:50%;background:#f4c1d9;display:grid;place-items:center;flex:none}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:#f7f7f7;white-space:nowrap}
.tag.ok{background:#e4f6e0;color:#1c7a0c}
.tag.wait{background:#fff0cc;color:#7a5300}
.tag.pink{background:#f4c1d9}
.sec{padding:16px 16px 0}
.sec h2{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.sec h2 span{font-weight:500;color:#625d60;font-size:12px}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid #dedbdd;border-radius:14px;padding:11px 12px;margin-bottom:8px;min-height:60px}
.pick .radio{width:20px;height:20px;border-radius:50%;border:2px solid #aaa3a7;flex:none}
.pick[aria-pressed="true"]{border:2px solid #231f20;padding:10px 11px}
.pick[aria-pressed="true"] .radio{border:6px solid #231f20}
.pick:disabled{background:#f7f7f7;color:#8d878a}
.pick .grow{flex:1;min-width:0}
.pick strong{display:block;font-size:14px}
.pick em{display:block;font-style:normal;font-size:12px;color:#625d60}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid #dedbdd;border-radius:14px;padding:6px}
.stepper button{width:48px;height:48px;border-radius:10px;background:#f7f7f7;font-size:22px;font-weight:600}
.stepper input{width:100%;min-width:0;text-align:center;font-size:30px;font-weight:600;border:0;font-family:Urbanist,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid #dedbdd;border-radius:999px;padding:8px 14px;min-height:40px;font-size:13px;font-weight:500}
.chips button[aria-pressed="true"]{background:#231f20;border-color:#231f20;color:#fff}
textarea.note{width:100%;margin-top:10px;border:1px solid #dedbdd;border-radius:14px;padding:10px 12px;font-size:16px;resize:none}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos figure,.shoot{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative}
.photos img{width:100%;height:100%;object-fit:cover}
.photos figure button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:rgba(35,31,32,.75);color:#fff;font-size:16px}
.photos figcaption{position:absolute;left:0;right:0;bottom:0;background:rgba(35,31,32,.65);color:#fff;font-size:10px;padding:2px 6px}
.shoot{border:1.5px dashed #231f20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer;background:#fdf1f7}
.link{font-size:12px;color:#625d60;text-decoration:underline;text-underline-offset:3px;min-height:36px;margin-top:2px}
.map{display:block;width:100%;height:auto;background:#eef0ec}
.missing{font-size:12px;color:#625d60;text-align:center;margin-bottom:8px}
.done{padding:30px 20px;text-align:center}
.check{width:72px;height:72px;border-radius:50%;background:#29bf12;color:#fff;display:grid;place-items:center;margin:0 auto 14px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.check svg{width:38px;height:38px;stroke-width:3}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.done h2{font-size:21px;font-weight:800;margin-bottom:6px}
.kv{border:1px solid #dedbdd;border-radius:16px;margin:18px 0;text-align:left}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid #eceaeb;font-size:13px}
.kv div:last-child{border:0}
.kv span{color:#625d60}.kv b{text-align:right}
.msgs{padding:14px 12px;display:flex;flex-direction:column;gap:10px;min-height:100%;justify-content:flex-end}
.me{align-self:flex-end;background:#f4c1d9;border-radius:18px 18px 6px 18px;padding:10px 14px;max-width:84%;font-weight:500;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:#f7f7f7;border-radius:18px 18px 18px 6px;padding:10px 14px;max-width:88%}
.bot .btn{margin-top:10px}
.bot.alert{background:#fff;border:2px solid #231f20}
.card{border:1px solid #dedbdd;border-radius:18px;padding:12px 14px;width:100%}
.line-item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #eceaeb}
.line-item strong{display:block;font-size:13.5px}
.line-item em{display:block;font-style:normal;font-size:12px;color:#625d60}
.line-item .r{text-align:right;white-space:nowrap}
.line-item .r b{font-size:17px}
.line-item.swap{background:#fdeaf3;border:1px solid #e79bc0;border-radius:12px;padding:10px;margin-top:8px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0}
.total b{font-size:21px}
.composer{display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;height:46px;border:1px solid #c9c4c7;border-radius:999px;padding:0 16px;font-size:16px}
.composer button{width:46px;height:46px;border-radius:50%;background:#f4c1d9;display:grid;place-items:center;flex:none}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.sugg button{white-space:nowrap;border:1px solid #dedbdd;border-radius:999px;padding:7px 12px;font-size:12.5px;min-height:36px}
.empty{padding:40px 20px;text-align:center;color:#625d60}

/* internal app, d3 */
.office{max-width:1240px;margin:14px auto 28px;padding:0 12px}
.shell{background:#ececea;border-radius:24px;display:grid;grid-template-columns:200px 1fr;overflow:hidden}
.side{padding:18px 12px;border-right:1px solid #d6d6d3}
.side .brand{display:flex;gap:8px;align-items:center;font-weight:800;margin-bottom:18px;padding:0 6px}
.side .brand img{width:34px;height:34px;object-fit:contain}
.side a{display:flex;justify-content:space-between;padding:9px 10px;border-radius:10px;color:#4a4a4a;font-size:13px;margin-bottom:2px}
.side a.on{background:#272727;color:#fff;font-weight:600}
.side a b{background:#f4c1d9;color:#231f20;border-radius:999px;padding:0 7px;font-size:11px}
.side h3{font-size:11px;color:#6b6b69;text-transform:uppercase;letter-spacing:.08em;padding:12px 10px 5px;font-weight:600}
.main{padding:18px;min-width:0;color:#272727}
.main h1{font-size:22px;font-weight:700}
.main .sub{color:#6b6b69;font-size:13px}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.mode{background:#e4f6e0;color:#1c7a0c;border-radius:999px;padding:7px 14px;font-weight:600;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{background:#fdfdfc;border-radius:16px;padding:12px 14px}
.stat span{font-size:12px;color:#6b6b69;display:block}
.stat b{font-size:30px;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border-radius:999px;background:#fdfdfc;padding:8px 14px;font-size:12.5px;min-height:40px}
.tabs button[aria-selected="true"]{background:#272727;color:#fff;font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:12px;align-items:start}
.list{background:#fdfdfc;border-radius:16px;overflow:hidden}
.req{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid #e2e2df}
.req:last-child{border:0}
.req img{width:52px;height:52px;border-radius:10px;object-fit:cover}
.req strong{display:block;font-size:13.5px;font-weight:600}
.req em{display:block;font-style:normal;font-size:12px;color:#6b6b69}
.req .r{text-align:right}
.req .r b{display:block;font-size:18px;font-weight:600}
.req[aria-pressed="true"]{background:#fdeef5;box-shadow:inset 3px 0 #272727}
.detail{background:#fdfdfc;border-radius:16px;padding:16px}
.detail h2{font-size:16px;font-weight:700}
.detail h4{font-size:12px;color:#6b6b69;font-weight:600;margin:16px 0 7px}
.detail .photos button{aspect-ratio:1;border-radius:12px;overflow:hidden}
.detail .kv{margin:0}
.detail .map{border-radius:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.timeline{list-style:none}
.timeline li{position:relative;padding:0 0 12px 20px;font-size:12.5px}
.timeline li:before{content:"";position:absolute;left:0;top:5px;width:9px;height:9px;border-radius:50%;background:#29bf12}
.timeline li.todo:before{background:#fff;border:2px solid #a3a3a0}
.timeline li:not(:last-child):after{content:"";position:absolute;left:4px;top:16px;bottom:0;width:1px;background:#d6d6d3}
.timeline small{display:block;color:#6b6b69}
dialog{border:0;border-radius:18px;padding:0;margin:auto;max-width:min(92vw,640px);background:#000}
dialog img{display:block;width:100%}
dialog::backdrop{background:rgba(0,0,0,.7)}
.stamp{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#625d60;margin-top:8px}
.stamp .i{width:16px;height:16px;margin-top:1px}
.camera{position:fixed;inset:0;z-index:25;background:#161314;color:#fff;display:flex;flex-direction:column;align-items:center;padding:max(12px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom))}
.camera>*{width:100%;max-width:480px}
.camera .top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;flex:none}
.camera .x{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:22px}
.view{position:relative;flex:1;min-height:0;margin:10px 0;border-radius:24px;overflow:hidden;background:#000}
.view video{width:100%;height:100%;object-fit:cover}
.view .gps{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.62);border-radius:12px;padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.view .gps i{width:9px;height:9px;border-radius:50%;background:#ffd34d;flex:none}
.view .gps.ok i{background:#29bf12}.view .gps.bad i{background:#f4442e}
.camera .problem{background:#fff;color:#231f20;border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:10px;flex:none}
.camera .btn{color:#231f20;flex:none}
.camera .btn:disabled{background:#4a4447;color:#b9b2b5}
.camera .link{color:#d8d1d4;flex:none;text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#231f20;color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;z-index:30;max-width:92vw;text-align:center}

@media(max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid #d6d6d3;padding:10px}
  .side .brand,.side h3,.side a:not(.on){display:none}
  .side a{gap:10px;white-space:nowrap}
  .split{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .main{padding:14px}
}
@media(max-width:600px){
  .seg{margin-left:0;width:100%}.seg button{flex:1}
  .demo{position:static}
  .reset{margin-left:auto}
  .steps{display:flex;overflow-x:auto;scrollbar-width:none}
  .steps button{flex:none;min-height:44px;padding:8px 10px}
  .steps button:not(.on) span{display:none}
  .dealer{margin:10px 0 0;border-radius:0;padding:8px}
  .phone{height:calc(100dvh - 90px);min-height:560px;border-radius:20px}
}
@media(max-width:360px){.req{grid-template-columns:40px minmax(0,1fr) auto;gap:8px;padding:10px}.req img{width:40px;height:40px}.req .tag{font-size:10px;padding:2px 6px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="demo"><div class="demo-in">
  <div><b>DEMO · Đổi trả bánh mì que</b><small>Dữ liệu giả, chưa nối hệ thống thật</small></div>
  <button class="reset" data-act="reset">Làm lại từ đầu</button>
  <div class="seg" role="tablist" aria-label="Chọn màn hình">
    <button role="tab" data-act="side" data-v="dealer">Đại lý · dathang</button>
    <button role="tab" data-act="side" data-v="office">Nội bộ · BMQ AI</button>
  </div>
</div></div>
<div class="steps" id="steps"></div>
<div id="app"></div>
<dialog id="zoom"><img alt="Ảnh bằng chứng phóng to"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const LOGO="logo.png";
const ICON={
 back:'<path d="M19 12H5m6-6-6 6 6 6"/>', msg:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/>',
 swap:'<path d="M4 8h13l-3-3m6 11H7l3 3"/>', list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/>',
 pin:'<path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/>',
 send:'<path d="m5 12 15-8-5 16-3-7Z"/>', ok:'<path d="m5 13 4 4 10-11"/>', lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vnd=n=>n.toLocaleString("vi-VN")+"đ";

/* ảnh minh hoạ cho demo */
function sample(kind){
 const sticks=[[70,120,-18],[110,200,8],[60,280,-6]].map(([x,y,r],i)=>{
  const broken=kind!==1&&i===1, burnt=kind===1&&i<2;
  const body=(a,w)=>`<rect x="${a}" y="0" width="${w}" height="46" rx="23" fill="${burnt?'#7a461c':'#d99a4e'}"/><path d="M${a+22} 14q14 10 30 4m24-4q14 10 30 4" stroke="${burnt?'#3d200b':'#f2c98a'}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  return `<g transform="translate(${x} ${y}) rotate(${r})">${broken?body(0,118)+`<g transform="translate(142 16) rotate(14)">${body(0,112)}</g><circle cx="130" cy="26" r="3" fill="#b9782f"/><circle cx="137" cy="44" r="4" fill="#b9782f"/>`:body(0,270)}</g>`}).join("");
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${kind===2?'#9aa6a0':'#c8b6a2'}"/><rect x="28" y="60" width="344" height="300" rx="18" fill="#efe6da"/>${sticks}</svg>`;
 return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
const SHOP={lat:10.76090,lng:106.63620};
function meters(a,b){const r=Math.PI/180,x=(b.lng-a.lng)*r*Math.cos((a.lat+b.lat)/2*r),y=(b.lat-a.lat)*r;return Math.round(Math.hypot(x,y)*6371000)}
const dist=m=>m<1000?m+" m":(m/1000).toFixed(1).replace(".",",")+" km";
function map(loc){
 const m=meters(SHOP,loc), far=m>500, px=far?282:200, py=far?42:70;
 return `<svg class="map" viewBox="0 0 360 150" role="img" aria-label="Sơ đồ vị trí chụp so với điểm bán, cách ${dist(m)}">
 <path d="M0 108H360M0 46H360M92 0V150M246 0V150" stroke="#fff" stroke-width="13"/><path d="M-10 150 190 -10" stroke="#fff" stroke-width="8"/>
 <line x1="170" y1="92" x2="${px}" y2="${py}" stroke="#272727" stroke-dasharray="4 4"/>
 <circle cx="170" cy="92" r="9" fill="#3c91e6" stroke="#fff" stroke-width="3"/>

 <div class="tabs" role="tablist">${[["all","Tất cả"],["wait","Chờ giao bù"],["used","Đã vào đơn"]].map(([v,t])=>`<button role="tab" data-act="filter" data-v="${v}" aria-selected="${S.filter===v}">${t}</button>`).join("")}</div>

 ${r?detail(r):""}</div></div></div></div>`}

 return `<aside class="detail" id="detail" aria-label="Chi tiết yêu cầu"><div class="head"><div><h2>${r.dealer}</h2><div class="sub">${r.id}</div></div><span class="tag ok">Đã tự động duyệt</span></div>

/* ---------- máy ảnh: vị trí lấy tự động cùng ảnh, giống chấm công, không có bước thoả thuận ---------- */
const clock=()=>"25/11 "+new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",hour12:false});
const coords=l=>`${l.lat.toFixed(5)}, ${l.lng.toFixed(5)} · ±${l.acc} m`;
const locate=()=>new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),()=>res(null),{enableHighAccuracy:true,timeout:12000,maximumAge:0})});
let cam=null;
function closeCamera(){if(!cam)return;cam.stream&&cam.stream.getTracks().forEach(t=>t.stop());cam.el.remove();cam=null}
async function openCamera(){
 if(cam||S.form.photos.length>=3)return;
 const el=document.createElement("div");el.className="camera";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Chụp ảnh bánh lỗi");
 el.innerHTML=`<div class="top">Chụp ảnh bánh lỗi<button class="x" aria-label="Đóng máy ảnh">×</button></div><div class="view"><video playsinline muted autoplay></video><div class="gps" role="status"><i></i><span>Đang lấy vị trí...</span></div></div><div class="problem" role="alert" hidden></div><button class="btn shutter" disabled>${ic("cam")} Chụp</button><button class="link sample">Demo trên máy tính: dùng ảnh mẫu</button>`;
 document.body.appendChild(el);
 const q=s=>el.querySelector(s), c=cam={el,stream:null,loc:null,ready:false,camError:""};
 const refresh=()=>{
  const g=q(".gps");g.className="gps "+(c.loc?"ok":c.locDone?"bad":"");
  g.querySelector("span").textContent=c.loc?clock()+" · "+coords(c.loc):c.locDone?"Chưa lấy được vị trí":"Đang lấy vị trí...";
  const msg=c.camError||(c.locDone&&!c.loc?"Hãy bật định vị và cho phép trình duyệt dùng vị trí, rồi mở lại máy ảnh.":"");
  q(".problem").textContent=msg;q(".problem").hidden=!msg;
  q(".shutter").disabled=!(c.ready&&c.loc);
 };
 q(".x").onclick=closeCamera;
 const add=(url,loc)=>{S.form.photos.push(url);S.form.shots.push({time:clock().slice(6),loc});closeCamera();render()};
 q(".sample").onclick=()=>add(sample(S.form.photos.length%3),{lat:10.76134,lng:106.63652,acc:15,demo:true});
 q(".shutter").onclick=()=>{
  const v=q("video"),k=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),cv=document.createElement("canvas");
  cv.width=Math.round(v.videoWidth*k);cv.height=Math.round(v.videoHeight*k);
  const x=cv.getContext("2d");x.drawImage(v,0,0,cv.width,cv.height);
  const h=Math.max(16,Math.round(cv.width/28));x.fillStyle="rgba(0,0,0,.6)";x.fillRect(0,cv.height-h*2,cv.width,h*2);
  x.fillStyle="#fff";x.font=`600 ${Math.round(h*.8)}px system-ui,sans-serif`;x.textBaseline="middle";x.fillText(clock()+" · "+coords(c.loc),h*.5,cv.height-h,cv.width-h);
  add(cv.toDataURL("image/jpeg",.82),c.loc);
 };
 locate().then(l=>{c.loc=l;c.locDone=true;if(cam===c)refresh()});
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false});
  if(cam!==c){st.getTracks().forEach(t=>t.stop());return}
  c.stream=st;const v=q("video");v.srcObject=st;await v.play().catch(()=>{});
  if(v.readyState<2)await new Promise(r=>v.onloadeddata=r);
  c.ready=true;
 }catch(_){c.camError="Chưa mở được máy ảnh. Hãy cho phép trình duyệt dùng máy ảnh."}
 if(cam===c)refresh();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCamera()});

function steps(){
 const cur=S.side==="office"?2:S.screen==="order"?(S.chat.length?4:3):S.screen==="inbox"?0:1;
 const done=[mine().length>0,S.seenOffice&&mine().length>0,!!S.ordered&&S.ordered.swaps.length>0,S.noticed];
 return ["Đại lý chụp ảnh, gửi","App BMQ AI nhận","Đặt bánh kèm bánh đổi","Nhắn đổi bù kiểu cũ"].map((t,i)=>`<button data-act="step" data-v="${i+1}" class="${cur===i+1?"on":done[i]?"done":""}"><i>${done[i]&&cur!==i+1?"✓":i+1}</i><span>${t}</span></button>`).join("")}
let lastKey="";
function render(){
 const key=S.side+S.screen, old=document.querySelector(".body"), top=old&&key===lastKey?old.scrollTop:0, chatLen=S.chat.length;

 document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===S.side));
 document.querySelector("#app").innerHTML=S.side==="office"?office():`<main class="dealer"><div class="phone">${({inbox:dInbox,returns:dReturns,form:dForm,done:dDone,order:dOrder})[S.screen]()}</div></main>`;
 const body=document.querySelector(".body");
 if(body)body.scrollTop=S.screen==="order"&&chatLen?body.scrollHeight:top;
 lastKey=key;
}
let tt;function toast(t){const e=document.querySelector("#toast");e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3200)}
function say(t){
 t=t.trim();if(!t)return;S.chat.push({me:true,t});
 /* quy tắc nhận diện tạm cho demo: có "đổi/bù" đi cùng số, "bù", "trả" hoặc "bánh" */
 const n=t.normalize("NFC").toLowerCase().replace(/đ/g,"d").normalize("NFD").replace(/[̀-ͯ]/g,"");
 if(/\b(doi|bu)\s*(bu|tra|banh|\d+)\b|\d+\s*(que|cai)?\s*(doi|bu)\b/.test(n)){S.chat.push({notice:true});S.noticed=true}
 else S.chat.push({t:"Đây là bản demo. Anh/chị thử nhắn tin đổi bù ở gợi ý bên dưới."});
 render();
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v,f=S.form;
 if(a==="reset"){init()}
 else if(a==="side"){S.side=v;if(v==="office"){S.seenOffice=true;const m=mine()[0];if(m){S.sel=m.id;S.filter="all"}}scrollTo(0,0)}
 else if(a==="step"){S.side="dealer";if(v==="1"){S.form=blank();S.screen="form"}else if(v==="2"){S.side="office";S.seenOffice=true;const m=mine()[0];if(m){S.sel=m.id;S.filter="all"}}else{S.screen="order";if(v==="4"&&!S.chat.length)return say("Mai đổi bù 5 que bị bể")}}
 else if(a==="go"){S.side="dealer";S.screen=v}
 else if(a==="new"){S.side="dealer";S.form=blank();S.screen="form"}
 else if(a==="order"){f.order=v;f.qty=Math.min(f.qty,ORDERS.find(o=>o.id===v).qty)}
 else if(a==="qty"){const o=ORDERS.find(x=>x.id===f.order);f.qty=Math.max(1,Math.min(o?o.qty:150,f.qty+Number(v)))}
 else if(a==="reason")f.reason=v;
 else if(a==="camera")return openCamera();
 else if(a==="rmphoto"){f.photos.splice(Number(v),1);f.shots.splice(Number(v),1)}
 else if(a==="submit"){if(missing().length||S.requests.some(r=>r.mine&&r.order===f.order))return;
  const n=mine().length+3;
  /* demo: vị trí thật của người xem được coi là điểm bán lệch nhẹ để sơ đồ có nghĩa */
  const loc=f.shots[0].loc, base=loc.demo?SHOP:{lat:loc.lat-.00038,lng:loc.lng-.00029};
  S.sent={id:"DT-1125-00"+n,dealer:"Đại lý Thanh Thanh",order:f.order,qty:f.qty,reason:f.reason,note:f.note,photos:f.photos.slice(),loc,base,at:clock(),used:null,mine:true};
  S.requests.unshift(S.sent);S.ordered=null;S.screen="done"}
 else if(a==="place"){const p=pending();p.forEach(r=>r.used="DH-1126-018");S.ordered={swaps:p};toast(p.length?"Đã đặt đơn kèm bánh đổi. Bên BMQ AI đổi sang “Đã vào đơn”.":"Đã đặt đơn.")}
 else if(a==="say")return say(v);
 else if(a==="filter"){S.filter=v}
 else if(a==="sel"){S.sel=v;render();if(innerWidth<=900)document.querySelector("#detail").scrollIntoView({behavior:"smooth"});return}
 else if(a==="zoom"){const d=document.querySelector("#zoom");d.querySelector("img").src=S.requests.find(r=>r.id===b.dataset.id).photos[Number(v)];d.showModal();return}
 render();
});
document.querySelector("#zoom").addEventListener("click",e=>e.currentTarget.close());
document.addEventListener("input",e=>{if(e.target.id==="note")S.form.note=e.target.value});
document.addEventListener("change",e=>{
 const f=S.form;
 if(e.target.id==="qty"){const o=ORDERS.find(x=>x.id===f.order);f.qty=Math.max(1,Math.min(o?o.qty:150,parseInt(e.target.value,10)||1));e.target.value=f.qty;const s=document.querySelector('[data-act="submit"]');s.innerHTML=ic("send")+" Gửi yêu cầu đổi "+f.qty+" que"}

});
document.addEventListener("submit",e=>{e.preventDefault();say(document.querySelector("#msg").value)});
init();render();
</script>
</body>
</html>
